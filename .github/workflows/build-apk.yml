name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Tadamoun Tchad - Consular APK'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Ensure Web Assets are Up to Date
        run: |
          mkdir -p android/app/src/main/assets
          if [ -f public/tadamoun_standalone.html ]; then
            cp public/tadamoun_standalone.html android/app/src/main/assets/index.html
          fi

      - name: 🔨 Compile Android APK
        working-directory: android
        run: |
          # Generate gradle-wrapper.jar if not committed in git
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew || true

          # Build APK directly using gradle or generated gradlew
          gradle assembleRelease --no-daemon --stacktrace || \
          gradle assembleDebug --no-daemon --stacktrace || \
          ./gradlew assembleRelease --no-daemon --stacktrace || \
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Locate & Prepare APK Artifact
        run: |
          mkdir -p release-output
          # Find generated APK from release or debug outputs
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release-output/Tadamoun-Tchad-v1.0.0.apk
          echo "APK_PATH=release-output/Tadamoun-Tchad-v1.0.0.apk" >> $GITHUB_ENV

      - name: 📤 Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tadamoun-Tchad-Android-APK
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: 🚀 Publish GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "تضامن تشاد - Tadamoun Tchad v1.0.${{ github.run_number }}"
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
          body: |
            ### 📱 تطبيق تضامن تشاد (Tadamoun Tchad) - تمنراست والجنوب الجزائري
            تم بناء ملف الـ APK تلقائياً بواسطة **GitHub Actions**.

            #### 📥 التحميل والتثبيت:
            - قم بتحميل ملف **`Tadamoun-Tchad-v1.0.0.apk`** من المرفقات أدناه.
            - افتح الملف على هاتفك الأندرويد، ووافق على تثبيت التطبيقات من هذا المصدر (Install from Unknown Sources).

            ---
            ### 🇫🇷 Application Tadamoun Tchad (APK Android)
            APK compilé automatiquement via GitHub Actions.

            #### 📥 Téléchargement & Installation :
            - Téléchargez le fichier **`Tadamoun-Tchad-v1.0.0.apk`** ci-dessous.
            - Ouvrez le fichier sur votre smartphone Android et autorisez l'installation d'applications externes si demandé.

            ---
            **Hotline Consulaire Urgence SOS :** `+213 661 16 85 61`
            **WhatsApp :** `https://wa.me/213661168561`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
